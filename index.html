<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Illustrator Text Export and Import</title>
		<link rel="stylesheet" href="assets/css/main.css">

		<style>
		</style>
	</head>
	<body>

		<div class="page">

			<div class="container container_col">
				<div class="page__mode" id="mode_label">Mode(native)</div>

				<div class="page__section">
					<div class="page__section-title">EXPORT TO...</div>
					<div class="page__inner">
						<!-- type="button" prevents accidental form submit if ever wrapped in <form> -->
						<button type="button" class="button" id="btn_expToXml" data-tooltip="Export active document text to XML.">XML...</button>
						<button type="button" class="button" id="btn_expToXliff" data-tooltip="Export active document text to XLIFF 1.2.">XLIFF...</button>
						<button type="button" class="button" id="btn_batchExp" data-tooltip="Export text from all files in selected folder to one XML.">BATCH...</button>
					</div>
					<div class="page__line-sep"></div>
				</div>

				<div class="page__section">
					<div class="page__section-title">IMPORT FROM...</div>
					<div class="page__inner">
						<button type="button" class="button" id="btn_impFromXml" data-tooltip="Import translated XML into active document.">XML...</button>
						<button type="button" class="button" id="btn_impFromXliff" data-tooltip="Import translated XLIFF into active document.">XLIFF...</button>
						<button type="button" class="button" id="btn_batchImp" data-tooltip="Apply batch XML translation and save files with language suffix.">BATCH...</button>
					</div>
					<div class="page__line-sep"></div>
				</div>

				<div class="page__section">
					<div class="page__section-title">ABOUT</div>
					<div class="page__inner">
						<button type="button" class="button" id="btn_about" data-tooltip="Show extension information.">ABOUT</button>
						<button type="button" class="button" id="btn_help" data-tooltip="Show usage help and tips.">HELP</button>
						<button type="button" class="button" id="btn_reload" data-tooltip="Reload panel UI.">RELOAD</button>
					</div>
				</div>

			</div>

		</div>

		<script src="assets/js/CSInterface.js"></script>
		<script src="assets/js/themeChanger.js"></script>
		<script src="assets/js/fitPanelToContent.js"></script>
		<script src="assets/js/reloadPanel.js"></script>
		<script src="components/tooltip/tooltip.js"></script>
		<script defer src="assets/js/main.js"></script>

	</body>
</html>
